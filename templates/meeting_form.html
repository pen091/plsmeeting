<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if meeting %}Edit{% else %}New{% endif %} Meeting | Scheduler Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body { background: #f4f7fe; color: #334155; font-family: 'Inter', sans-serif; }
        .form-card { 
            background: #ffffff; 
            border-radius: 20px; 
            border: none; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.04);
            max-width: 600px;
            margin: 40px auto;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px;
            border: 1px solid #e2e8f0;
            background: #f8fafc;
        }
        .form-control:focus {
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
            border-color: #4f46e5;
        }
        .btn-save { background: #4f46e5; color: white; border-radius: 10px; padding: 12px; font-weight: 600; border: none; }
        .btn-save:hover { background: #4338ca; }
        .btn-back { color: #64748b; text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="container">
    <div class="form-card p-4 p-md-5">
        <div class="mb-4 d-flex justify-content-between align-items-center">
            <h3 class="fw-bold m-0">{% if meeting %}Update{% else %}Create{% endif %} Meeting</h3>
            <a href="{% url 'dashboard' %}" class="btn-back"><i class="bi bi-arrow-left"></i> Home</a>
        </div>

        <form method="POST">
            {% csrf_token %}
            
            <!-- Meeting Title -->
            <div class="mb-4">
                <label class="form-label fw-semibold">Meeting Title</label>
                <input type="text" name="title" class="form-control" 
                       placeholder="e.g. Weekly Sync with Marketing" 
                       value="{{ meeting.title|default:'' }}" required>
            </div>

            <!-- Date and Time Picker -->
            <div class="mb-4">
                <label class="form-label fw-semibold">Date & Time</label>
                <input type="datetime-local" name="date_time" class="form-control" 
                       value="{{ meeting.date_time|date:'Y-m-d\TH:i' }}" required>
            </div>

            <!-- Manual Email Adding -->
            <div class="mb-4">
                <label class="form-label fw-semibold">Invitees (Gmail Addresses)</label>
                <textarea name="emails" class="form-control" rows="3" 
                          placeholder="Separate emails with commas (e.g. boss@gmail.com, team@gmail.com)">{{ meeting.emails|default:'' }}</textarea>
                <div class="form-text mt-2">Emails added here will be saved to this meeting log.</div>
            </div>

            <!-- Send Now Toggle -->
            <div class="form-check form-switch mb-4 p-3 bg-light rounded-3">
                <input class="form-check-input ms-0 me-3" type="checkbox" name="send_to_gmail" id="mailToggle">
                <label class="form-check-label fw-semibold" for="mailToggle">
                    Send invitation to their Gmail inbox now
                </label>
            </div>

            <button type="submit" class="btn btn-save w-100 mb-3">
                <i class="bi bi-check-circle-fill me-2"></i> Save & Finish
            </button>

            <!-- WhatsApp Shortcut (Uses client-side link for performance) -->
            <a id="waButton" href="#" target="_blank" class="btn btn-outline-success w-100 py-2 border-2" style="border-radius:10px;">
                <i class="bi bi-whatsapp me-2"></i> WhatsApp "Check Mail" Alert
            </a>
        </form>
    </div>
</div>

<script>
    // Dynamically update the WhatsApp link based on the form title
    document.querySelector('input[name="title"]').addEventListener('input', function(e) {
        const title = encodeURIComponent(e.target.value || "the upcoming meeting");
        const waLink = `https://wa.me/?text=Hi! I just scheduled ${title}. CHECK YOUR MAILBOX FOR NEXT MEETING SCHEDULE.`;
        document.getElementById('waButton').href = waLink;
    });
</script>

</body>
</html>
